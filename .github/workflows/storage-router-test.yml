name: Storage Router Integration Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'storage-router/**'
      - 'photo-storage/**'
      - 'server/src/repositories/remote-storage.repository.ts'
      - '.github/workflows/storage-router-test.yml'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local multi-volume routing test
        run: node ./storage-router/test-multi-volume.mjs

      - name: Run production Storage Router lifecycle test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          REMOTE_STORAGE_TOKEN: ${{ secrets.REMOTE_STORAGE_TOKEN }}
          STORAGE_ROUTER_URL: https://storage-router-production.up.railway.app
        run: ./storage-router/test-storage.ps1
