name: Remote Storage Check

on:
  pull_request:
    branches: [3.2.1-remote]
  push:
    branches: [3.2.1-remote]
    paths:
      - 'photo-storage/**'
      - 'storage-router/**'
      - 'all-in-one/patch-remote-media-input.mjs'
      - 'all-in-one/Dockerfile'
      - 'server/src/repositories/media.repository.ts'
      - '.github/workflows/remote-storage-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check photo-storage/server.mjs
      - run: node --check storage-router/server.mjs
      - run: node --check all-in-one/patch-remote-media-input.mjs

  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v3.2.1 MediaRepository patch still applies
        run: node ./all-in-one/patch-remote-media-input.mjs
      - name: Verify all remote media input wrappers are present
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('server/src/repositories/media.repository.ts', 'utf8');
          const required = [
            'this.withAvailableInput(input, (availableInput) => this.extractAvailable(availableInput))',
            'this.withAvailableInput(input, (availableInput) =>\n      this.getImageDecodingPipeline(availableInput, options)',
            'this.withAvailableInput(input, (availableInput) => this.generateThumbnailAvailable(availableInput, options, output))',
            'this.withAvailableInput(input, (availableInput) => this.generateThumbhashAvailable(availableInput, options))',
            'this.withAvailableInput(input, (availableInput) => this.probeAvailable(availableInput, options))',
            'this.withAvailableInput(input, (availableInput) => this.probePacketsAvailable(availableInput, streamIndex))',
            'this.withAvailableInput(input, (availableInput) => this.transcodeAvailable(availableInput, output, options))',
            'return this.withAvailableInput(input, async (availableInput) => {',
            'private async withAvailableInput<T>',
          ];
          const missing = required.filter((needle) => !source.includes(needle));
          if (missing.length) {
            console.error('Missing remote media patch assertions:', missing);
            process.exit(1);
          }
          console.log(`Verified ${required.length} remote media patch assertions`);
          NODE

  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server workspace dependencies
        run: |
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/plugin-sdk build
      - run: node ./all-in-one/patch-remote-media-input.mjs
      - run: pnpm --filter immich check
