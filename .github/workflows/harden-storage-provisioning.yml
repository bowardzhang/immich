name: Harden storage provisioning source checks

on:
  push:
    branches: [3.1.0-remote]
    paths:
      - '.github/workflows/harden-storage-provisioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.1.0-remote

      - name: Add fail-closed repo/branch verification
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('storage-router/provisioner.mjs')
          text = path.read_text()

          old = "const HEALTH_TIMEOUT_MS = Number(process.env.STORAGE_PROVISION_HEALTH_TIMEOUT_MS || 2 * 60 * 1000);\nconst RETRY_COUNT = Number(process.env.RAILWAY_API_RETRY_COUNT || 4);"
          new = "const HEALTH_TIMEOUT_MS = Number(process.env.STORAGE_PROVISION_HEALTH_TIMEOUT_MS || 2 * 60 * 1000);\nconst SOURCE_VERIFY_TIMEOUT_MS = Number(process.env.STORAGE_PROVISION_SOURCE_VERIFY_TIMEOUT_MS || 30 * 1000);\nconst RETRY_COUNT = Number(process.env.RAILWAY_API_RETRY_COUNT || 4);"
          if old not in text:
              raise SystemExit('timeout insertion anchor not found')
          text = text.replace(old, new, 1)

          anchor = """async function createStorageService(index) {
"""
          helper = r'''async function getServiceSource(serviceId) {
  const data = await gql(
    `query serviceInstance($serviceId: String!, $environmentId: String!) { serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { source { repo branch image } } }`,
    { serviceId, environmentId: ENVIRONMENT_ID },
  );
  return data.serviceInstance?.source || {};
}

async function waitForExpectedSource(serviceId, index) {
  const deadline = Date.now() + SOURCE_VERIFY_TIMEOUT_MS;
  let lastSource = {};

  while (Date.now() < deadline) {
    lastSource = await getServiceSource(serviceId);
    if (lastSource.repo === REPO && lastSource.branch === BRANCH) {
      return lastSource;
    }
    await sleep(2000);
  }

  throw new Error(
    `Photo Storage ${index} source is not ready: expected repo=${REPO} branch=${BRANCH}, got repo=${lastSource.repo || 'missing'} branch=${lastSource.branch || 'missing'}. Refusing to create/attach a volume or deploy an incomplete service.`,
  );
}

'''
          if anchor not in text:
              raise SystemExit('createStorageService anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old = """    await configureService(service.id);
    const volume = await createOrReuseVolume(service.id, index);
"""
          new = """    await configureService(service.id);
    const source = await waitForExpectedSource(service.id, index);
    console.log(
      JSON.stringify({
        event: 'storage-provision',
        action: 'source-verified',
        index,
        serviceId: service.id,
        repo: source.repo,
        branch: source.branch,
      }),
    );

    const volume = await createOrReuseVolume(service.id, index);
"""
          if old not in text:
              raise SystemExit('ensureNextVolume anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          readme = Path('README.md')
          r = readme.read_text()
          old_doc = "The provisioner explicitly supplies the repository, environment and branch when creating a new `Photo Storage N`, then waits for deployment success and health before adding it to the active pool."
          new_doc = "The provisioner explicitly supplies the repository, environment and branch when creating a new `Photo Storage N`. It then reads the created Railway service instance back and **verifies that both repository and branch exactly match the expected values before creating/attaching a volume or starting a deployment**. If Railway creates a service without the requested branch, provisioning now fails closed instead of launching a broken deployment; after the source is repaired, the next provisioning attempt can safely reuse the service."
          if old_doc not in r:
              raise SystemExit('README provisioning paragraph anchor not found')
          readme.write_text(r.replace(old_doc, new_doc, 1))
          PY

          node --check storage-router/provisioner.mjs

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage-router/provisioner.mjs README.md
          git diff --cached --check
          git commit -m "fix(storage): verify provisioned service branch before deploy"
          git push origin HEAD:3.1.0-remote
