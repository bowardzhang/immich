name: Patch storage provisioner branch setup

on:
  push:
    branches: [3.1.0-remote]
    paths:
      - '.github/workflows/patch-provisioner-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.1.0-remote

      - name: Patch provisioner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('storage-router/provisioner.mjs')
          text = path.read_text()

          marker = "async function waitForExpectedSource(serviceId, index) {"
          if 'async function ensureDeploymentTrigger(serviceId, index)' not in text:
              insert = r'''async function ensureDeploymentTrigger(serviceId, index) {
            const source = await getServiceSource(serviceId);
            const triggerRepoMatches = !source.triggerRepository || source.triggerRepository === REPO;
            if (source.repo === REPO && source.branch === BRANCH && triggerRepoMatches) {
              return source;
            }

            console.warn(
              JSON.stringify({
                event: 'storage-provision',
                action: 'create-deployment-trigger',
                index,
                serviceId,
                expectedRepo: REPO,
                expectedBranch: BRANCH,
                currentRepo: source.repo || null,
                currentBranch: source.branch || null,
              }),
            );

            const data = await gql(
              `mutation deploymentTriggerCreate($input: DeploymentTriggerCreateInput!) {
                deploymentTriggerCreate(input: $input) { id repository branch serviceId environmentId }
              }`,
              {
                input: {
                  projectId: PROJECT_ID,
                  environmentId: ENVIRONMENT_ID,
                  serviceId,
                  provider: 'github',
                  repository: REPO,
                  branch: BRANCH,
                },
              },
            );

            const trigger = data.deploymentTriggerCreate;
            console.log(
              JSON.stringify({
                event: 'storage-provision',
                action: 'deployment-trigger-created',
                index,
                serviceId,
                triggerId: trigger?.id || null,
                repo: trigger?.repository || REPO,
                branch: trigger?.branch || BRANCH,
              }),
            );
            return trigger;
          }

          '''
              if marker not in text:
                  raise SystemExit('waitForExpectedSource marker not found')
              text = text.replace(marker, insert + marker, 1)

          old_config = """      input: {\n        rootDirectory: ROOT_DIRECTORY,\n        startCommand: 'node server.mjs',\n        healthcheckPath: '/health',\n      },"""
          new_config = """      input: {\n        source: { repo: REPO },\n        rootDirectory: ROOT_DIRECTORY,\n        startCommand: 'node server.mjs',\n        healthcheckPath: '/health',\n      },"""
          if old_config in text:
              text = text.replace(old_config, new_config, 1)
          elif "source: { repo: REPO },\n        rootDirectory: ROOT_DIRECTORY" not in text:
              raise SystemExit('configureService input marker not found')

          old_flow = """    await configureService(service.id);\n    const source = await waitForExpectedSource(service.id, index);"""
          new_flow = """    await configureService(service.id);\n    await ensureDeploymentTrigger(service.id, index);\n    const source = await waitForExpectedSource(service.id, index);"""
          if old_flow in text:
              text = text.replace(old_flow, new_flow, 1)
          elif "await ensureDeploymentTrigger(service.id, index);" not in text:
              raise SystemExit('ensureNextVolume marker not found')

          path.write_text(text)
          PY

      - name: Syntax check
        run: node --check storage-router/provisioner.mjs

      - name: Commit hardened provisioner and remove temporary workflow
        run: |
          rm .github/workflows/patch-provisioner-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage-router/provisioner.mjs .github/workflows/patch-provisioner-branch.yml
          git commit -m "fix(storage): explicitly create Railway deployment trigger"
          git push origin HEAD:3.1.0-remote
