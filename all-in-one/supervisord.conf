[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:postgres]
command=/usr/lib/postgresql/14/bin/postgres -D %(ENV_PGDATA)s
user=postgres
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:redis]
command=/usr/bin/redis-server /tmp/redis-aio.conf
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:storage-index]
command=node /usr/local/lib/immich-storage-index.mjs
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

; Temporary read-only pre-upgrade audit. It only SELECTs the asset table and reads
; the local filesystem/storage index. No database rows or media files are changed.
[program:storage-diagnostic]
command=/bin/bash -lc 'until pg_isready -h 127.0.0.1 -p 5432 -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" >/dev/null 2>&1; do sleep 1; done; echo "[storage-diagnostic] START target=01fe98a4-fb84-4c98-a8b1-48f0e8382cb1"; PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" -Atc "SELECT row_to_json(a) FROM asset a WHERE id = '\''01fe98a4-fb84-4c98-a8b1-48f0e8382cb1'\'';" | sed "s/^/[storage-diagnostic] TARGET_ROW /"; PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" -At -F "|" -c "SELECT id, \"originalPath\" FROM asset ORDER BY id;" > /tmp/storage-diagnostic-assets.tsv; total=0; local_ok=0; missing=0; indexed=0; unindexed=0; shown_indexed=0; shown_unindexed=0; index_file="${STORAGE_INDEX_FILE:-/data/.aio/storage-index.json}"; while IFS="|" read -r asset_id original_path; do [ -n "$asset_id" ] || continue; total=$((total+1)); if [ -f "$original_path" ]; then local_ok=$((local_ok+1)); continue; fi; missing=$((missing+1)); remote_path="$original_path"; case "$remote_path" in /data/*) remote_path="${remote_path#/data/}";; esac; if [ -f "$index_file" ] && grep -Fq "\"$remote_path\":" "$index_file"; then indexed=$((indexed+1)); if [ "$shown_indexed" -lt 30 ]; then echo "[storage-diagnostic] MISSING_LOCAL_INDEXED id=$asset_id path=$original_path remote=$remote_path"; shown_indexed=$((shown_indexed+1)); fi; else unindexed=$((unindexed+1)); if [ "$shown_unindexed" -lt 30 ]; then echo "[storage-diagnostic] MISSING_LOCAL_UNINDEXED id=$asset_id path=$original_path remote=$remote_path"; shown_unindexed=$((shown_unindexed+1)); fi; fi; done < /tmp/storage-diagnostic-assets.tsv; target_path="$(PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$DB_USERNAME" -d "$DB_DATABASE_NAME" -Atc "SELECT \"originalPath\" FROM asset WHERE id = '\''01fe98a4-fb84-4c98-a8b1-48f0e8382cb1'\'';")"; if [ -n "$target_path" ]; then if [ -f "$target_path" ]; then target_local=yes; else target_local=no; fi; target_remote="$target_path"; case "$target_remote" in /data/*) target_remote="${target_remote#/data/}";; esac; if [ -f "$index_file" ] && grep -Fq "\"$target_remote\":" "$index_file"; then target_indexed=yes; else target_indexed=no; fi; echo "[storage-diagnostic] TARGET_STORAGE path=$target_path local=$target_local remote_path=$target_remote indexed=$target_indexed index_file=$index_file"; fi; echo "[storage-diagnostic] SUMMARY total=$total local_ok=$local_ok missing_local=$missing missing_local_indexed=$indexed missing_local_unindexed=$unindexed"; echo "[storage-diagnostic] END"'
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=28

[program:immich]
command=/bin/bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U "$DB_USERNAME" -d "$DB_DATABASE_NAME"; do sleep 1; done; until redis-cli -h 127.0.0.1 -p "$REDIS_PORT" ping >/dev/null 2>&1; do sleep 1; done; exec start.sh'
directory=/usr/src/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[group:immich-aio]
programs=postgres,redis,storage-index,storage-diagnostic,immich
priority=999
